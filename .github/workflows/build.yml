name: Netch Build CI
on: [push, pull_request]

jobs:
  build:
    name: Build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Netch.WebUI/package-lock.json

      - name: Test WebUI
        working-directory: src/Netch.WebUI
        run: |
          npm ci
          npm test

      - name: Checksum
        shell: pwsh
        run: |
          echo "SOURCE_NETCH_SHA256=$(.\scripts\sha256.ps1 .\src)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_OTHER_SHA256=$(.\scripts\sha256.ps1 .\vendor)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_REDIRECTOR_SHA256=$(.\scripts\sha256.ps1 .\src\native\Redirector)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_ROUTEHELPER_SHA256=$(.\scripts\sha256.ps1 .\src\native\RouteHelper)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV

      - name: Cache Netch
        uses: actions/cache@v3
        with:
          key: Netch-${{ runner.os }}-Netch-${{ env.SOURCE_NETCH_SHA256 }}
          path: |
            .\src\Netch\bin

      - name: Cache Other
        uses: actions/cache@v3
        with:
          key: Netch-${{ runner.os }}-Other-${{ env.SOURCE_OTHER_SHA256 }}
          path: |
            .\vendor\release

      - name: Cache Redirector
        uses: actions/cache@v3
        with:
          key: Netch-${{ runner.os }}-Redirector-${{ env.SOURCE_REDIRECTOR_SHA256 }}
          path: |
            .\src\native\Redirector\bin

      - name: Cache RouteHelper
        uses: actions/cache@v3
        with:
          key: Netch-${{ runner.os }}-RouteHelper-${{ env.SOURCE_ROUTEHELPER_SHA256 }}
          path: |
            .\src\native\RouteHelper\bin

      - name: Check Other
        id: check_other
        uses: andstor/file-existence-action@v2
        with:
          files: .\vendor\release\aiodns.bin

      - name: Setup Go
        uses: actions/setup-go@v3
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          go-version: stable

      - name: Setup C++
        uses: msys2/setup-msys2@v2
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          update: true
          release: true
          install: base-devel git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-libevent mingw-w64-x86_64-pcre2 mingw-w64-x86_64-freetype mingw-w64-x86_64-libpng mingw-w64-x86_64-bzip2 mingw-w64-x86_64-openssl mingw-w64-x86_64-mbedtls mingw-w64-x86_64-libsodium mingw-w64-x86_64-c-ares mingw-w64-x86_64-boost mingw-w64-x86_64-libmariadbclient unzip p7zip autoconf automake libtool

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          toolchain: nightly
          profile: minimal

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3.1
        with:
          vs-prerelease: true

      - name: Test .NET application layer
        shell: pwsh
        run: dotnet test .\tests\Netch.Tests\Tests.csproj -c Release -p:Platform=x64 -p:SkipWebUIBuild=true

      - name: Build
        shell: pwsh
        run: |
          .\build.ps1 -Configuration Release -OutputPath release

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: release
          path: release
